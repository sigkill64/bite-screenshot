[package]
name = "bite_screenshot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
directories = "5"
global-hotkey = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "avif"] }
serde = { version = "1", features = ["derive"] }
screenshots = "0.8"
thiserror = "1"
toml = "0.8"
open = "5"
windows-capture = "1.5"

[target.'cfg(windows)'.dependencies]
winrt-notification = "0.5"
windows = { version = "0.58", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
